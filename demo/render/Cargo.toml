[package]
name = "castrender"
version = "0.1.0"
edition = "2021"
# An example rather than a binary: `cargo install --git` refuses a repo
# with two binary packages in it.
autoexamples = false

[lib]
path = "lib.rs"

[[example]]
name = "castrender"
path = "examples/castrender.rs"

[workspace]

[dependencies]
vt100 = { package = "ttmux-vt100", path = "../../vendor/vt100" }
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
serde_json = "1"

[profile.release]
debug = false
