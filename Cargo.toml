[package]
name = "ttmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A modern terminal multiplexer: tiling + free-floating panes, mouse, curved borders, in-UI config"
license = "MIT"
repository = "https://github.com/ttmux/ttmux"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
