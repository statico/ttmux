[package]
name = "ttmux"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "A modern terminal multiplexer: tiling + free-floating panes, mouse, curved borders, in-UI config"
license = "MIT"
repository = "https://github.com/statico/ttmux"
keywords = ["terminal", "multiplexer", "tmux", "tui", "pty"]
categories = ["command-line-utilities"]
# The demo videos are over the crates.io size limit. crates.io takes the
# README's images from the repository instead.
exclude = ["docs/", "demo/", ".github/"]

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "serde"] }
portable-pty = "0.9"
# Forked for grapheme clusters, extended SGR and scrollback fixes; see
# vendor/vt100/TTMUX.md.
vt100 = { package = "ttmux-vt100", version = "0.16.2", path = "vendor/vt100" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
